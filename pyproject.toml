[project]
name = "polardrl"
version = "0.1.0"
description = "Reproducibility codebase for PolarDRL: DRL for polarization-disagreement minimization via sequential link recommendation (foundation paper: Zhu et al. 2021)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "networkx>=3.2",
    "pytest>=8.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# Phase 4 (DRL agent) only -- CPU-only PyTorch, hand-rolled GNN, no
# torch-geometric. Install via:
#   uv pip install -e ".[drl]" --extra-index-url https://download.pytorch.org/whl/cpu
# (this machine has no NVIDIA GPU; the CPU wheel avoids pulling ~2.5GB of
# unused CUDA libraries that the default PyPI torch wheel bundles).
drl = [
    "torch>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polardrl"]
