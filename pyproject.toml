[project]
name = "polardrl"
version = "0.1.0"
description = "Reproducibility codebase for PolarDRL: DRL for polarization-disagreement minimization via sequential link recommendation (foundation paper: Zhu et al. 2021)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "networkx>=3.2",
    "pytest>=8.0",
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polardrl"]
